name: ✨ Feature Proposal (NSoC'26)
description: Suggest an idea or new capability for CodePulse
title: "[FEAT]: "
labels: ["nsoc26", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🚀 Nexus Spring of Code (NSoC) 2026 Feature Proposal
        Got an idea to make CodePulse / DevBattle even more awesome? Propose it here!
        **Rule:** You must wait for Admin review and official assignment before opening any PR.
  - type: input
    id: title
    attributes:
      label: Feature Title
      description: Concise one-liner describing the feature.
      placeholder: e.g. Add dark/light mode toggle shortcut (Cmd+Shift+L)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or what value does it add for developers?
      placeholder: Currently users must open settings to switch theme...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Implementation Details
      description: Detailed description of how this should work and which files/components would be affected.
      placeholder: Implement global keyboard listener using cmdk or custom hook in root layout...
    validations:
      required: true
  - type: dropdown
    id: suggested_level
    attributes:
      label: Proposed NSoC Level
      description: Select the appropriate level matching NSoC guidelines:
      options:
        - "Level 1 (3 Pts) - Documentation / Small modification"
        - "Level 2 (5 Pts) - UI / Frontend / Component enhancement"
        - "Level 3 (10 Pts) - Core Logic / Backend / API / Database"
    validations:
      required: true
  - type: checkboxes
    id: assignment_acknowledgment
    attributes:
      label: NSoC Contributor Checklist
      options:
        - label: I would like to work on this issue once approved and assigned.
          required: false
        - label: I understand that PRs opened without official assignment will be closed.
          required: true

