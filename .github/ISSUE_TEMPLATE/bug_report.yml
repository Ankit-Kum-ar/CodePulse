name: 🐛 Bug Report (NSoC'26)
description: Report a reproducible bug in CodePulse
title: "[BUG]: "
labels: ["nsoc26", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🌟 Nexus Spring of Code (NSoC) 2026 Bug Report
        Thank you for helping improve CodePulse! Please provide clear details so we can reproduce and verify this issue.
        **Note:** Do not start working on a PR until an Admin has officially assigned this issue to you.
  - type: input
    id: summary
    attributes:
      label: Brief Summary
      description: A clear and concise description of the bug.
      placeholder: e.g. Leaderboard avatar images fail to render on safari mobile
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '/leaderboard'
        2. Click on 'India' tab
        3. Scroll down past 20 items
        4. See error in console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: Avatars should lazy-load smoothly without throwing console errors.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: Drag and drop screenshots, GIF, or screen recordings demonstrating the issue.
    validations:
      required: false
  - type: dropdown
    id: suggested_level
    attributes:
      label: Suggested NSoC Level
      description: Based on NSoC guidelines, what difficulty level is this? (Admin makes final decision)
      options:
        - "Level 1 (3 Pts) - Documentation / Typo / Minor fix"
        - "Level 2 (5 Pts) - UI / Frontend / Component fix"
        - "Level 3 (10 Pts) - Core Logic / Backend / Database fix"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Contribution Terms
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I will wait for an Admin (@code-with-abhi-i5) to assign me before opening a PR.
          required: true

