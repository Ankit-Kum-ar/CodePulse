name: 🛡️ Security & Secret Leak Shield

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    name: 🔍 Scan for Accidental Secrets & Private Keys
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: 🛡️ Scan Git Diff for Secrets & Credentials
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            console.log('Running Security & Secret Leak Shield...');

            // High-risk credential and token regexes
            const secretRules = [
              { name: 'GitHub Personal Access Token (Classic)', regex: /\bghp_[A-Za-z0-9_]{36}\b/ },
              { name: 'GitHub Fine-Grained PAT', regex: /\bgithub_pat_[A-Za-z0-9_]{82}\b/ },
              { name: 'Private Key Block', regex: /-----BEGIN (?:RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY-----/ },
              { name: 'AWS Access Key ID', regex: /\bAKIA[0-9A-Z]{16}\b/ },
              { name: 'OpenAI Secret Key', regex: /\bsk-[a-zA-Z0-9]{32,}\b/ },
              { name: 'Discord Webhook URL', regex: /https:\/\/discord(?:app)?\.com\/api\/webhooks\/[0-9]+\/[A-Za-z0-9_-]+/ },
              { name: 'Slack Webhook URL', regex: /https:\/\/hooks\.slack\.com\/services\/T[A-Za-z0-9_]+\/B[A-Za-z0-9_]+\/[A-Za-z0-9_]+/ },
              { name: 'Supabase Service Role JWT', regex: /eyJhbGciOi[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+/ }
            ];

            // Files to ignore from scanning (documentation, lockfiles, tests with mock placeholders)
            const ignoredPatterns = [
              /\.env\.example$/,
              /package-lock\.json$/,
              /\.md$/,
              /src\/test\//,
              /\.test\.[jt]sx?$/,
              /\.spec\.[jt]sx?$/
            ];

            let changedFiles = [];
            try {
              if (context.eventName === 'pull_request') {
                const baseSha = context.payload.pull_request.base.sha;
                const headSha = context.payload.pull_request.head.sha;
                const diffOutput = execSync(`git diff --name-only ${baseSha} ${headSha}`, { encoding: 'utf-8' });
                changedFiles = diffOutput.split('\n').filter(Boolean);
              } else {
                const diffOutput = execSync('git diff --name-only HEAD~1 HEAD', { encoding: 'utf-8' });
                changedFiles = diffOutput.split('\n').filter(Boolean);
              }
            } catch (err) {
              console.warn('Git diff failed, scanning all tracked files:', err.message);
              const allFiles = execSync('git ls-files', { encoding: 'utf-8' });
              changedFiles = allFiles.split('\n').filter(Boolean);
            }

            console.log(`Scanning ${changedFiles.length} changed files...`);
            const violations = [];

            for (const file of changedFiles) {
              if (!fs.existsSync(file)) continue;

              // 1. Prohibit committing .env files (except .env.example)
              const baseName = path.basename(file);
              if (baseName.startsWith('.env') && baseName !== '.env.example') {
                violations.push({
                  file,
                  rule: 'Forbidden Environment File',
                  detail: `Committed '${file}' to git. Environment files with secrets must never be tracked in git.`
                });
                continue;
              }

              if (ignoredPatterns.some(pattern => pattern.test(file))) {
                continue;
              }

              try {
                const content = fs.readFileSync(file, 'utf-8');

                for (const rule of secretRules) {
                  if (rule.name === 'Supabase Service Role JWT') {
                    // Check if it has service_role claim
                    const match = content.match(rule.regex);
                    if (match) {
                      try {
                        const payload = JSON.parse(Buffer.from(match[0].split('.')[1], 'base64').toString());
                        if (payload.role === 'service_role') {
                          violations.push({
                            file,
                            rule: rule.name,
                            detail: `Detected Supabase service_role JWT in '${file}'. This bypasses database Row-Level Security!`
                          });
                        }
                      } catch {}
                    }
                  } else if (rule.regex.test(content)) {
                    violations.push({
                      file,
                      rule: rule.name,
                      detail: `Detected pattern matching '${rule.name}' in '${file}'.`
                    });
                  }
                }
              } catch (e) {
                // binary file or read failure, skip
              }
            }

            if (violations.length > 0) {
              console.error('\n🚨 CRITICAL SECURITY LEAK DETECTED:');
              violations.forEach(v => console.error(`  - [${v.rule}] in ${v.file}: ${v.detail}`));
              core.setFailed(`Security & Secret Shield failed: ${violations.length} secret(s) or sensitive file(s) found! Remove them and rotate any exposed keys immediately.`);
            } else {
              console.log('✅ Secret Shield Passed: 0 leaks detected in changed files.');
            }

