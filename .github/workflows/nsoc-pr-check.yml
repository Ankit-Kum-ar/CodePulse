name: 🛡️ NSoC'26 PR Compliance Gatekeeper

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: 🔍 Check NSoC Issue Assignment & Tags
    runs-on: ubuntu-latest
    steps:
      - name: Validate Issue Link & Auto-Apply NSoC Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const currentLabels = pr.labels.map(l => l.name.toLowerCase());
            const labelsToAdd = [];

            // 1. Mandatory 'nsoc26' label
            if (!currentLabels.includes('nsoc26')) {
              labelsToAdd.push('nsoc26');
            }

            // 2. Extract linked issue number (e.g., Closes #12, Fixes #45)
            const issueMatch = body.match(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/i);
            let detectedLevel = null;

            if (issueMatch && issueMatch[1]) {
              const issueNumber = parseInt(issueMatch[1], 10);
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                
                const issueLabels = issue.data.labels.map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
                if (issueLabels.includes('level1')) detectedLevel = 'level1';
                else if (issueLabels.includes('level2')) detectedLevel = 'level2';
                else if (issueLabels.includes('level3')) detectedLevel = 'level3';

                console.log(`Linked issue #${issueNumber} has level: ${detectedLevel}`);
              } catch (err) {
                console.warn(`Could not fetch issue #${issueNumber}:`, err.message);
              }
            }

            // 3. Fallback: Parse PR body checklist if issue has no level label
            if (!detectedLevel) {
              if (/-\s*\[x\]\s*.*\bLevel\s*1\b/i.test(body)) detectedLevel = 'level1';
              else if (/-\s*\[x\]\s*.*\bLevel\s*2\b/i.test(body)) detectedLevel = 'level2';
              else if (/-\s*\[x\]\s*.*\bLevel\s*3\b/i.test(body)) detectedLevel = 'level3';
            }

            // Apply Level label if not already present
            const hasAnyLevelLabel = currentLabels.some(l => ['level1', 'level2', 'level3'].includes(l));
            if (detectedLevel && !hasAnyLevelLabel) {
              labelsToAdd.push(detectedLevel);
              console.log(`Auto-detected level: ${detectedLevel}`);
            }

            // Apply labels
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd
              });
              console.log(`Added labels [${labelsToAdd.join(', ')}] to PR #${pr.number}`);
            }

            // 4. Warning if no linked issue found
            if (!issueMatch) {
              const warningComment = `👋 Hi @${pr.user.login}!\n\n` +
                `⚠️ **NSoC 2026 Compliance Alert:**\n` +
                `According to official **Nexus Spring of Code 2026** guidelines, every PR must be linked to an **assigned issue**.\n\n` +
                `Please update your PR description to include your assigned issue (e.g., \`Closes #12\` or \`Fixes #12\`).\n\n` +
                `> *Note: PRs opened without prior issue assignment cannot be merged under NSoC rules.*`;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const alreadyCommented = comments.data.some(c => c.body.includes("NSoC 2026 Compliance Alert"));
              if (!alreadyCommented) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: warningComment
                });
              }
            }
