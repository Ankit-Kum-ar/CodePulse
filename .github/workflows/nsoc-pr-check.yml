name: 🛡️ NSoC'26 PR Compliance Gatekeeper

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    name: 🔍 NSoC Quality Control & Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Enforce NSoC'26 Quality & Labelling Rules
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            let currentLabels = pr.labels.map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
            const labelsToAdd = [];
            const labelsToRemove = [];
            const violations = [];

            console.log(`Analyzing PR #${pr.number} by @${pr.user.login}...`);

            // ==========================================
            // 1. MANDATORY TAG: nsoc26
            // ==========================================
            if (!currentLabels.includes('nsoc26')) {
              labelsToAdd.push('nsoc26');
            }

            // ==========================================
            // 1B. AUTO-ASSIGN PR AUTHOR TO PR
            // ==========================================
            try {
              const currentAssignees = (pr.assignees || []).map(a => a.login.toLowerCase());
              if (!currentAssignees.includes(pr.user.login.toLowerCase())) {
                console.log(`Auto-assigning PR author @${pr.user.login} to PR #${pr.number}...`);
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [pr.user.login]
                });
                console.log(`✅ Auto-assigned @${pr.user.login} as PR Assignee.`);
              }
            } catch (err) {
              console.warn(`Could not auto-assign author to PR: ${err.message}`);
            }

            // ==========================================
            // 1C. AUTO-REQUEST REVIEW FROM MAINTAINER (@code-with-abhi-i5)
            // ==========================================
            const maintainer = 'code-with-abhi-i5';
            if (pr.user.login.toLowerCase() !== maintainer.toLowerCase()) {
              try {
                const requested = (pr.requested_reviewers || []).map(r => r.login.toLowerCase());
                if (!requested.includes(maintainer.toLowerCase())) {
                  console.log(`Auto-requesting review from @${maintainer} on PR #${pr.number}...`);
                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    reviewers: [maintainer]
                  });
                  console.log(`✅ Requested review from @${maintainer}.`);
                }
              } catch (err) {
                console.warn(`Could not request review from @${maintainer}: ${err.message}`);
              }
            }

            // ==========================================
            // 1D. CONVENTIONAL COMMITS PR TITLE VALIDATION
            // ==========================================
            const prTitle = (pr.title || "").trim();
            const conventionalPattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([a-zA-Z0-9_\-\/.]+\))?!?: .+/;
            if (!conventionalPattern.test(prTitle)) {
              violations.push(`❌ **Non-Conventional PR Title**: NSoC standards require [Conventional Commits](https://www.conventionalcommits.org/) PR titles (e.g. \`feat(auth): add discord oauth\` or \`fix(topbar): resolve focus ring\`). Current title: \`${prTitle}\``);
            }

            // ==========================================
            // 1E. MERGE CONFLICT / DIRTY BRANCH CHECK
            // ==========================================
            if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
              violations.push("❌ **Merge Conflict Detected**: This branch has conflicts with `main`. Please rebase your branch:\n```bash\ngit fetch origin\ngit rebase origin/main\n# resolve conflicts\ngit push --force-with-lease\n```");
            }

            // ==========================================
            // 2. CHECK 0-LINE / TRIVIAL EDITS (Section 8 & 9)
            // ==========================================
            if (pr.changed_files === 0 || (pr.additions + pr.deletions === 0)) {
              violations.push("❌ **0-Line Changes**: This PR has 0 line changes. NSoC rules strictly prohibit merging empty/0-line PRs (-5 point penalty for maintainers).");
            }

            // ==========================================
            // 3. CHECK GITIGNORE COMPLIANCE / FORBIDDEN FILES
            // ==========================================
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const forbiddenPatterns = [
              /^\.env(?!\.example$)/,
              /^node_modules\//,
              /(?:^|\/)node_modules\//,
              /^dist\//,
              /(?:^|\/)dist\//,
              /(?:^|\/)\.DS_Store$/,
              /(?:^|\/)Thumbs\.db$/,
              /(?:^|\/)\.vscode\//,
              /(?:^|\/)\.idea\//
            ];

            const forbiddenFiles = [];
            let allFilesAreDocs = true;

            for (const file of files.data) {
              const filename = file.filename;
              for (const pattern of forbiddenPatterns) {
                if (pattern.test(filename)) {
                  forbiddenFiles.push(filename);
                  break;
                }
              }

              // Check if PR only changes documentation
              const isDoc = filename.endsWith('.md') || filename.endsWith('.txt') || filename.startsWith('.github/');
              if (!isDoc) {
                allFilesAreDocs = false;
              }
            }

            if (forbiddenFiles.length > 0) {
              violations.push(`❌ **Gitignore Violation**: Proper use of \`.gitignore\` is mandatory. The following files must be removed from the PR:\n\`\`\`\n${forbiddenFiles.slice(0, 10).join('\n')}\n\`\`\``);
            }

            // ==========================================
            // 4. LINKED ISSUE & ASSIGNMENT CHECK
            // ==========================================
            const issueMatch = body.match(/(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/i);
            let detectedLevel = null;
            let linkedIssue = null;

            if (issueMatch && issueMatch[1]) {
              const issueNumber = parseInt(issueMatch[1], 10);
              try {
                const issueRes = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                linkedIssue = issueRes.data;

                const issueLabels = linkedIssue.labels.map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
                if (issueLabels.includes('level3')) detectedLevel = 'level3';
                else if (issueLabels.includes('level2')) detectedLevel = 'level2';
                else if (issueLabels.includes('level1')) detectedLevel = 'level1';

                // Check if contributor is assigned
                const assignees = (linkedIssue.assignees || []).map(a => a.login.toLowerCase());
                if (assignees.length > 0 && !assignees.includes(pr.user.login.toLowerCase())) {
                  violations.push(`⚠️ **Assignment Warning**: Issue #${issueNumber} is currently assigned to @${assignees.join(', @')} instead of @${pr.user.login}. Please make sure you are officially assigned before merging.`);
                }
              } catch (err) {
                console.warn(`Could not fetch linked issue #${issueNumber}:`, err.message);
              }
            } else {
              violations.push("❌ **Missing Linked Issue**: According to NSoC'26 guidelines, every PR must be linked to an assigned issue using `Closes #issue-number` or `Fixes #issue-number`.");
            }

            // ==========================================
            // 5. LEVEL DETECTION & STRICT RULES
            // ==========================================
            if (!detectedLevel) {
              if (/-\s*\[x\]\s*.*\bLevel\s*3\b/i.test(body)) detectedLevel = 'level3';
              else if (/-\s*\[x\]\s*.*\bLevel\s*2\b/i.test(body)) detectedLevel = 'level2';
              else if (/-\s*\[x\]\s*.*\bLevel\s*1\b/i.test(body)) detectedLevel = 'level1';
            }

            // Rule: README-only or doc-only edits cannot be Level 2 or Level 3
            if (allFilesAreDocs && (detectedLevel === 'level2' || detectedLevel === 'level3')) {
              console.log("Downgrading doc-only change from", detectedLevel, "to level1");
              detectedLevel = 'level1';
              violations.push("ℹ️ **Level Adjustment**: Documentation and README changes are categorized strictly as **Level 1** (3 points) per NSoC guidelines.");
            }

            // Apply exactly one Level label
            const existingLevels = currentLabels.filter(l => ['level1', 'level2', 'level3'].includes(l));
            
            if (detectedLevel) {
              if (!currentLabels.includes(detectedLevel)) {
                labelsToAdd.push(detectedLevel);
              }
              // If there are other conflicting levels, remove them
              for (const lvl of existingLevels) {
                if (lvl !== detectedLevel) {
                  labelsToRemove.push(lvl);
                }
              }
            }

            // ==========================================
            // 6. SHARED BRANCH WARNING
            // ==========================================
            const headRef = (pr.head && pr.head.ref) ? pr.head.ref.toLowerCase() : "";
            if (headRef === 'main' || headRef === 'master') {
              violations.push("⚠️ **Branch Notice**: Contributor opened PR from `" + headRef + "`. NSoC requires working on a dedicated feature branch (e.g. `feature/my-task`).");
            }

            // ==========================================
            // 7. APPLY LABELS & REMOVE CONFLICTS
            // ==========================================
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd
              });
              console.log(`Added labels [${labelsToAdd.join(', ')}]`);
            }

            for (const rem of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: rem
                });
                console.log(`Removed conflicting label: ${rem}`);
              } catch (e) {
                console.warn(`Could not remove label ${rem}:`, e.message);
              }
            }

            // ==========================================
            // 8. COMMENT VIOLATIONS OR APPROVAL
            // ==========================================
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const header = "### 🛡️ NSoC 2026 Quality Control Review";
            const botComment = comments.data.find(c => c.body && c.body.includes(header));

            if (violations.length > 0) {
              const bodyMessage = `${header}\n\n` +
                `Hello @${pr.user.login}, here is the compliance review for your pull request against **Nexus Spring of Code (NSoC) 2026** standards:\n\n` +
                violations.map(v => `- ${v}`).join('\n\n') +
                `\n\n---\n*Please address the points above before this PR can be merged.*`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: bodyMessage
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: bodyMessage
                });
              }

              // Fail the check if there are blocking violations
              const hasBlockingViolation = violations.some(v => v.startsWith('❌'));
              if (hasBlockingViolation) {
                core.setFailed("PR does not meet NSoC'26 Quality Control guidelines. See comment above for details.");
              }
            } else {
              const successMessage = `${header}\n\n` +
                `🎉 **All NSoC'26 Quality Checks Passed!**\n\n` +
                `- ✅ Linked issue verified\n` +
                `- ✅ \`nsoc26\` and valid \`${detectedLevel || 'level'}\` label applied\n` +
                `- ✅ Conventional PR title validated\n` +
                `- ✅ Zero merge conflicts with \`main\`\n` +
                `- ✅ Contributor @${pr.user.login} assigned as PR Assignee\n` +
                `- ✅ Review requested from maintainer @${maintainer}\n` +
                `- ✅ \`.gitignore\` rules respected (no build/env files)\n` +
                `- ✅ Code changes validated\n\n` +
                `Maintainer (@${maintainer}) can now proceed with final code review and merge.`;

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: successMessage
                });
              }
            }
