name: 👋 Welcome First-Time Contributors

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    name: 💬 Post Welcome Message
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            🎉 Thank you for submitting your first Pull Request to **CodePulse** for **Nexus Spring of Code 2026**!
            
            - 🤖 Our automated CI checks are currently testing your code.
            - 📋 Please ensure your PR description links your assigned issue with `Closes #<issue-number>`.
            - 🏷️ Once CI passes, a maintainer will review your code and assign your NSoC Level tag.

