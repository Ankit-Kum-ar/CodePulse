name: Seed Curated NSoC Level-2 Issues

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/seed-issues.js'
      - '.github/workflows/seed-issues.yml'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  seed:
    name: Publish Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Issue Seeder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node .github/scripts/seed-issues.js
