name: ⚡ PR Ops & Maintainer Slash Commands

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  handle-pr-command:
    name: 🚀 PR Slash Command Processor
    # Only run on pull request comments
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Execute PR Ops Command
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comment = context.payload.comment;
            const commentBody = (comment.body || "").trim();
            const sender = comment.user.login;
            const prNumber = context.payload.issue.number;
            const isMaintainer = sender.toLowerCase() === owner.toLowerCase();

            // Ignore bots
            if (comment.user.type === 'Bot' || sender.includes('bot')) return;

            console.log(`Processing PR comment on #${prNumber} by @${sender}: "${commentBody}"`);

            // Fetch full Pull Request details
            const prRes = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const pr = prRes.data;

            // ==========================================
            // 1. MAINTAINER SLASH COMMAND: /merge OR /lgtm
            // ==========================================
            const mergePattern = /^\/(?:merge|lgtm|shipit)\b/i;
            if (mergePattern.test(commentBody)) {
              if (!isMaintainer) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `⛔ **Permission Denied**: Only repository maintainer (@${owner}) can trigger automated merges with \`/merge\`.`
                });
                return;
              }

              if (pr.state !== 'open') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `ℹ️ **PR Not Open**: Pull Request #${prNumber} is currently \`${pr.state}\`.`
                });
                return;
              }

              // Check if mergeable
              if (pr.mergeable === false) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `❌ **Cannot Auto-Merge**: PR has merge conflicts with \`main\`. Please rebase the branch before merging.`
                });
                return;
              }

              console.log(`Initiating automated squash merge for PR #${prNumber}...`);

              try {
                const commitTitle = `${pr.title} (#${prNumber})`;
                const commitMessage = `Squash merged via maintainer slash command (/merge) by @${sender}.\n\nCo-authored-by: ${pr.user.login} <${pr.user.login}@users.noreply.github.com>`;

                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: 'squash',
                  commit_title: commitTitle,
                  commit_message: commitMessage
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `🎉 **Successfully Merged!**\n\nPR #${prNumber} has been squash-merged into \`main\` by maintainer @${sender}.\n\nThank you @${pr.user.login} for your great contribution to **CodePulse**! 🚀`
                });

                console.log(`✅ PR #${prNumber} successfully merged.`);
              } catch (mergeErr) {
                console.error("Merge failed:", mergeErr.message);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `⚠️ **Merge Failed**: ${mergeErr.message}. Please check if required status checks (CI, secret-shield) are still passing.`
                });
              }
              return;
            }

            // ==========================================
            // 2. HELPER SLASH COMMAND: /rebase
            // ==========================================
            const rebasePattern = /^\/rebase\b/i;
            if (rebasePattern.test(commentBody)) {
              const headRef = pr.head.ref;
              const headRepo = pr.head.repo ? pr.head.repo.full_name : `${pr.user.login}/${repo}`;

              const rebaseGuide = `### 🔄 Git Rebase Instructions for PR #${prNumber}\n\n` +
                `Hello @${pr.user.login}, here are the step-by-step commands to rebase your branch \`${headRef}\` against latest \`main\`:\n\n` +
                `\`\`\`bash\n` +
                `# 1. Fetch latest changes from upstream\n` +
                `git fetch origin\n\n` +
                `# 2. Switch to your feature branch\n` +
                `git checkout ${headRef}\n\n` +
                `# 3. Rebase onto latest main\n` +
                `git rebase origin/main\n\n` +
                `# 4. If there are conflicts, resolve them in your editor, then:\n` +
                `# git add .\n` +
                `# git rebase --continue\n\n` +
                `# 5. Force-push the clean rebased branch\n` +
                `git push --force-with-lease origin ${headRef}\n` +
                `\`\`\`\n\n` +
                `*Once pushed, CI and NSoC checks will automatically re-run!* 🚀`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: rebaseGuide
              });
              return;
            }
