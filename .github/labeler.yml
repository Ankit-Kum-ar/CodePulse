frontend:
  - changed-files:
      - any-glob-to-any-file: 'src/**/*'

backend:
  - changed-files:
      - any-glob-to-any-file: 'backend/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'

ci/cd:
  - changed-files:
      - any-glob-to-any-file: '.github/**/*'

