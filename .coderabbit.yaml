# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_instructions:
    - path: "src/**/*"
      instructions: |
        This is a Next.js 16 (App Router) + React 19 frontend with Tailwind CSS v4.
        - Verify components use modern React 19 hooks and Next.js App Router patterns.
        - Look for missing accessibility attributes (aria-labels).
        - Ensure responsive styles are well-formed.
    - path: "backend/**/*"
      instructions: |
        This is a NestJS 11 + Prisma ORM + BullMQ backend.
        - Verify type safety, DTO validation with class-validator.
        - Check that Prisma queries are properly typed and error-handled.
        - Ensure BullMQ background jobs are properly processed.
chat:
  auto_reply: true
instructions: |
  You are an expert open-source reviewer assisting the Project Kernel for Nexus Spring of Code (NSoC) 2026.
  Please keep these program rules in mind:
  1. Flag any suspicious, 0-line, or low-effort AI boilerplate PRs.
  2. If the PR makes a small cosmetic change (e.g., 5-10 lines), politely mention that this should be evaluated as Level 1 (3 points) rather than Level 2 or 3.
  3. Ensure the PR is clean, well-documented, and free of security issues.

